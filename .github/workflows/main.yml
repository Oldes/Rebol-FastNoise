name: 'Rebol-FastNoise CI'
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.3

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static FastNoise library
      run: ./siskin Rebol-FastNoise.nest cmake-fastnoise-x64
    - name: Build 64bit Rebol/FastNoise extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise-windows-x64.rebx --msvc fastnoise-x64
    - name: Minimal Rebol/FastNoise extension test
      run:  ./siskin --script ci-test.r3

    - name: Build 32bit static FastNoise library
      run: ./siskin Rebol-FastNoise.nest cmake-fastnoise-x86
    - name: Build 32bit Rebol/FastNoise extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise-windows-x86.rebx --msvc fastnoise-x86

    - name: Build arm64 static FastNoise library
      run: ./siskin Rebol-FastNoise.nest cmake-fastnoise-arm64
    - name: Build arm64 Rebol/FastNoise extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise-windows-arm64.rebx --msvc fastnoise-arm64

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-FastNoise-Windows-CI-${{github.run_id}}
        path: ./*.rebx


  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.3

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static FastNoise library
      run: ./siskin Rebol-FastNoise.nest cmake-fastnoise-x64
    - name: Build 64bit Rebol/FastNoise extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise-linux-x64.rebx --gzip fastnoise-x64
    - name: Minimal Rebol/FastNoise extension test
      run:  ./siskin --script ci-test.r3

    - name: Prepare 32bit gcc
      run: sudo apt install gcc-multilib g++-multilib
    - name: Build 32bit static FastNoise library
      run: ./siskin Rebol-FastNoise.nest cmake-fastnoise-x86
    - name: Build 32bit Rebol/FastNoise extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise-linux-x86.rebx --gzip fastnoise-x86

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-FastNoise-Linux-CI-${{github.run_id}}
        path: ./*.gz

  macos-arm:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.3
      with:
        arch: aarch64

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build arm64 static FastNoise library
      run: ./siskin Rebol-FastNoise.nest cmake-fastnoise-arm64

    - name: Build arm64 Rebol/FastNoise extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise-macos-arm64.rebx --gzip fastnoise-arm64

    - name: Minimal Rebol/FastNoise extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-FastNoise-macOS-arm-CI-${{github.run_id}}
        path: ./*.gz

  macos-x64:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.3

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build x64 static FastNoise library
      run: ./siskin Rebol-FastNoise.nest cmake-fastnoise-x64
    - name: Build x64 Rebol/FastNoise extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise-macos-x64.rebx --gzip fastnoise-x64
    - name: Minimal Rebol/FastNoise extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-FastNoise-macOS-x64-CI-${{github.run_id}}
        path: ./*.gz