name: 'Rebol-FastNoise2 CI'
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.3

    - name: Build 32bit Rebol/FastNoise2 extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise2-windows-x86.rebx --msvc fastnoise2-windows-x86

    - name: Build 64bit Rebol/FastNoise2 extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise2-windows-x64.rebx --msvc fastnoise2-windows-x64

    - name: Minimal Rebol/FastNoise2 extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-FastNoise2-Windows-CI-${{github.run_id}}
        path: ./*.rebx

  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.3

    - name: Build 64bit Rebol/FastNoise2 extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise2-linux-x64.rebx --gzip fastnoise2-linux-x64

    - name: Minimal Rebol/FastNoise2 extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-FastNoise2-Linux-CI-${{github.run_id}}
        path: ./*.gz

  macos:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.3

    - name: Build 64bit Rebol/FastNoise2 extension
      run: ./siskin Rebol-FastNoise.nest -o ./fastnoise2-macos-x64.rebx --gzip fastnoise2-macos-x64

    - name: Minimal Rebol/FastNoise2 extension test
      run:  ./siskin ci-test.r3

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-FastNoise2-macOS-CI-${{github.run_id}}
        path: ./*.gz

